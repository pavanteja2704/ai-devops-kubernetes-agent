apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-devops-agent-sa
  namespace: ai-devops-agent
  labels:
    app.kubernetes.io/name: ai-devops-kubernetes-agent
    app.kubernetes.io/component: serviceaccount
  annotations:
    # For GKE Workload Identity, replace PROJECT_ID with the target GCP project.
    # Example: iam.gke.io/gcp-service-account: ai-devops-agent-sa@PROJECT_ID.iam.gserviceaccount.com
    iam.gke.io/gcp-service-account: ai-devops-agent-sa@ai-agent-509509.iam.gserviceaccount.com
