apiVersion: v1
kind: Service
metadata:
  name: ai-devops-frontend
  namespace: ai-devops-agent
  labels:
    app.kubernetes.io/name: ai-devops-frontend
    app.kubernetes.io/component: web
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: ai-devops-frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
