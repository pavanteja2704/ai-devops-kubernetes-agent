apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-devops-agent
  namespace: ai-devops-agent
  labels:
    app.kubernetes.io/name: ai-devops-kubernetes-agent
    app.kubernetes.io/component: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-devops-kubernetes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-devops-kubernetes-agent
        app.kubernetes.io/component: app
    spec:
      serviceAccountName: ai-devops-agent-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: ai-devops-agent
          image: us-central1-docker.pkg.dev/ai-agent-509509/ai-devops-agent-repo/ai-devops-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: READ_ONLY_MODE
              value: "true"
            - name: GOOGLE_CLOUD_PROJECT
              value: "ai-agent-509509"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: GEMINI_MODEL
              value: "gemini-2.5-flash"
            - name: LOG_LEVEL
              value: "INFO"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
