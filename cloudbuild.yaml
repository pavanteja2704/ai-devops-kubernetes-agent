steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/ai-agent-509509/ai-devops-agent-repo/ai-devops-agent:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/ai-agent-509509/ai-devops-agent-repo/ai-devops-agent:latest

  - name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - us-central1-docker.pkg.dev/ai-agent-509509/ai-devops-agent-repo/ai-devops-frontend:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/ai-agent-509509/ai-devops-agent-repo/ai-devops-frontend:latest

images:
  - us-central1-docker.pkg.dev/ai-agent-509509/ai-devops-agent-repo/ai-devops-agent:latest
  - us-central1-docker.pkg.dev/ai-agent-509509/ai-devops-agent-repo/ai-devops-frontend:latest
