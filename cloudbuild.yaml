substitutions:
  _REGION: us-central1
  _REPOSITORY: ai-devops-agent-repo

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/ai-devops-agent:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/ai-devops-agent:latest

  - name: gcr.io/cloud-builders/docker
    dir: frontend
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/ai-devops-frontend:latest
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/ai-devops-frontend:latest

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/ai-devops-agent:latest
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPOSITORY/ai-devops-frontend:latest
